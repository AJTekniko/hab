<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AJTekniko/ajtekniko/main/pics/profile-pic.png"><title>Chokim</title></head><body><div class="container"><div class="header"><h1>⭐ Chokim</h1></div><div class="game-info"><div class="info-item"><div class="info-label">Puntos</div><div class="info-value" id="score">0</div></div><div class="info-item"><div class="info-label">Nivel</div><div class="info-value" id="level">1</div></div><div class="info-item"><div class="info-label">Precisión</div><div class="info-value" id="accuracy">0%</div></div><div class="info-item"><div class="info-label">Estrellas Distraídas</div><div class="info-value" id="destroyed">0</div></div></div><div class="game-area"><div class="space-area" id="spaceArea"></div><div class="earth-container"><div class="earth">🧍🏽‍♂️</div><button class="music-toggle" id="musicToggle">🔊 Música</button></div><div class="game-over" id="gameOver"><h2>JUEGO TERMINADO</h2><div class="score" id="finalScore">0</div><div class="stats"><div class="stats-row"><span>Nivel:</span><span id="statsFinalLevel">1</span></div><div class="stats-row"><span>Estrellas Distraídas:</span><span id="statsDestroyed">0</span></div><div class="stats-row"><span>Precisión:</span><span id="statsAccuracy">0%</span></div><div class="stats-divider"></div><div class="high-score-section"><h3>⭐ Tu mejor sesión</h3><div class="stats-row"><span>Puntos:</span><span id="statsHighScore">0</span></div><div class="stats-row"><span>Estrellas Distraídas:</span><span id="statsHighScoreMeteors">0</span></div></div></div><div class="controls"><button onclick="location.reload()">Jugar De Nuevo</button></div></div></div><div class="input-area"><input type="text" id="input" placeholder="Escribe las palabras para distraer las estrellas..." autocomplete="off"><button id="startBtn" onclick="startGame()">Comenzar</button></div></div><script src="script.js"></script></body></html>
